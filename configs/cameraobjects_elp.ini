# ELP-USB8MP02G-L180: Sony IMX179 sensor (1/3.2 inch, 1.4 um pixels, 3264x2448),
# 180 degree fisheye lens (HFOV > 180 degrees).
# ELP does not publish focal length, f-number, focus distance nor distortion of the L180 lens,
# values marked as "estimated" should be replaced with the values of the camera calibration
# (for example OpenCV cv::fisheye::calibrate gives focal length, principal point and k1-k4).
#
# Position is in mm (200 = 0.2 on the field in the opengl drawing, decimals are allowed)
# Direction of the camera, where to camera is watching
# all values can be decimals, except cameraCount
cameraCount=6
cameraSizeRate=0.25
cameraObjectPosition1=0/1000/0
cameraObjectDirection1=0/0/1
cameraObjectPosition2=400/1000/-300
cameraObjectDirection2=0.6428/0/-0.7660
cameraObjectPosition3=400/1000/-600
cameraObjectDirection3=0.6428/0/0.7660
cameraObjectPosition4=0/1000/-900
cameraObjectDirection4=0/0/-1
cameraObjectPosition5=-400/1000/-600
cameraObjectDirection5=-0.6428/0/0.7660
cameraObjectPosition6=-400/1000/-300
cameraObjectDirection6=-0.6428/0/-0.7660


# Camera object's roll (Rotation on side to side, in degrees, yaw, and pitch are set in cameraObjectDirection)
cameraObjectRoll1=0.0
cameraObjectRoll2=0.0
cameraObjectRoll3=0.0
cameraObjectRoll4=0.0
cameraObjectRoll5=0.0
cameraObjectRoll6=0.0

# Focal length of the camera in mm, estimated: equidistant fisheye with 180 degrees over the sensor width
# (sensor half width 2.2848 mm / (pi/2) = 1.4546 mm)
cameraObjectFocalLength1=1.4546
cameraObjectFocalLength2=1.4546
cameraObjectFocalLength3=1.4546
cameraObjectFocalLength4=1.4546
cameraObjectFocalLength5=1.4546
cameraObjectFocalLength6=1.4546

# Sensor size of the camera in mm, IMX179 active area 3264x2448 pixels * 1.4 um
cameraObjectSensorSize1=4.5696/3.4272
cameraObjectSensorSize2=4.5696/3.4272
cameraObjectSensorSize3=4.5696/3.4272
cameraObjectSensorSize4=4.5696/3.4272
cameraObjectSensorSize5=4.5696/3.4272
cameraObjectSensorSize6=4.5696/3.4272

# camera resolution in pixels, largest resolution of the camera
cameraObjectResolution1=3264/2448
cameraObjectResolution2=3264/2448
cameraObjectResolution3=3264/2448
cameraObjectResolution4=3264/2448
cameraObjectResolution5=3264/2448
cameraObjectResolution6=3264/2448

# Camera principal point offset in pixels (cx/cy), can be decimals, estimated: middle of the image
cameraObjectPrincipalPointOffset1=1631.5/1223.5
cameraObjectPrincipalPointOffset2=1631.5/1223.5
cameraObjectPrincipalPointOffset3=1631.5/1223.5
cameraObjectPrincipalPointOffset4=1631.5/1223.5
cameraObjectPrincipalPointOffset5=1631.5/1223.5
cameraObjectPrincipalPointOffset6=1631.5/1223.5

# Distortion model: pinhole (OpenCV camera model, radial k1-k6 and tangential p1/p2)
# or fisheye (OpenCV fisheye model, k1-k4), 180 degree lens needs fisheye
cameraObjectDistortionModel1=fisheye
cameraObjectDistortionModel2=fisheye
cameraObjectDistortionModel3=fisheye
cameraObjectDistortionModel4=fisheye
cameraObjectDistortionModel5=fisheye
cameraObjectDistortionModel6=fisheye

# Fisheye distortion parameters (k1/k2/k3/k4, can be decimals), angle on the image is
# theta*(1 + k1*theta^2 + k2*theta^4 + k3*theta^6 + k4*theta^8),
# estimated: 0.0/0.0/0.0/0.0 is ideal equidistant fisheye lens
cameraObjectFisheyeDistortionParameters1=0.0/0.0/0.0/0.0
cameraObjectFisheyeDistortionParameters2=0.0/0.0/0.0/0.0
cameraObjectFisheyeDistortionParameters3=0.0/0.0/0.0/0.0
cameraObjectFisheyeDistortionParameters4=0.0/0.0/0.0/0.0
cameraObjectFisheyeDistortionParameters5=0.0/0.0/0.0/0.0
cameraObjectFisheyeDistortionParameters6=0.0/0.0/0.0/0.0

# Field of view of the lens in degrees, rays wider than this are black (fisheye model only)
cameraObjectFieldOfView1=185.0
cameraObjectFieldOfView2=185.0
cameraObjectFieldOfView3=185.0
cameraObjectFieldOfView4=185.0
cameraObjectFieldOfView5=185.0
cameraObjectFieldOfView6=185.0

# Camera f-number (aperture), estimated
cameraObjectAperture1=2.0
cameraObjectAperture2=2.0
cameraObjectAperture3=2.0
cameraObjectAperture4=2.0
cameraObjectAperture5=2.0
cameraObjectAperture6=2.0

# Camera focus distance in mm, 1000 = 1.0f, estimated
cameraObjectFocusDistance1=1000
cameraObjectFocusDistance2=1000
cameraObjectFocusDistance3=1000
cameraObjectFocusDistance4=1000
cameraObjectFocusDistance5=1000
cameraObjectFocusDistance6=1000
