# IDS U3-33F1XLS-C Rev 1.2: uEye+ XLS board level USB3 color camera, S-mount (M12),
# Sony IMX568-AAQJ-C sensor (1/1.8 inch, global shutter, 2.74 um pixels, 2472x2062),
# lens Edmund Optics 4mm FL f/4 Rugged Blue Series M12 (stock #36-353, fixed iris,
# working distance 150 mm - infinity, max sensor format 1/3 inch,
# FOV on 1/3 inch sensor: horizontal 71.1, vertical 52.6, diagonal 90.8 degrees,
# distortion -25.68% at full field).
# Edmund Optics does not publish distortion coefficients nor principal point, values marked as "estimated"
# should be replaced with the values of the camera calibration
# (for example OpenCV cv::calibrateCamera gives focal length, principal point, k1-k6 and p1/p2).
#
# Position is in mm (200 = 0.2 on the field in the opengl drawing, decimals are allowed)
# Direction of the camera, where to camera is watching
# all values can be decimals, except cameraCount
cameraCount=6
cameraSizeRate=0.25
cameraObjectPosition1=0/1000/0
cameraObjectDirection1=0/0/1
cameraObjectPosition2=400/1000/-300
cameraObjectDirection2=0.6428/0/-0.7660
cameraObjectPosition3=400/1000/-600
cameraObjectDirection3=0.6428/0/0.7660
cameraObjectPosition4=0/1000/-900
cameraObjectDirection4=0/0/-1
cameraObjectPosition5=-400/1000/-600
cameraObjectDirection5=-0.6428/0/0.7660
cameraObjectPosition6=-400/1000/-300
cameraObjectDirection6=-0.6428/0/-0.7660


# Camera object's roll (Rotation on side to side, in degrees, yaw, and pitch are set in cameraObjectDirection)
cameraObjectRoll1=0.0
cameraObjectRoll2=0.0
cameraObjectRoll3=0.0
cameraObjectRoll4=0.0
cameraObjectRoll5=0.0
cameraObjectRoll6=0.0

# Focal length of the camera in mm
cameraObjectFocalLength1=4.0
cameraObjectFocalLength2=4.0
cameraObjectFocalLength3=4.0
cameraObjectFocalLength4=4.0
cameraObjectFocalLength5=4.0
cameraObjectFocalLength6=4.0

# Sensor size of the camera in mm, IMX568 optical size 2472x2062 pixels * 2.74 um
cameraObjectSensorSize1=6.773/5.650
cameraObjectSensorSize2=6.773/5.650
cameraObjectSensorSize3=6.773/5.650
cameraObjectSensorSize4=6.773/5.650
cameraObjectSensorSize5=6.773/5.650
cameraObjectSensorSize6=6.773/5.650

# camera resolution in pixels, largest resolution of the camera
cameraObjectResolution1=2472/2062
cameraObjectResolution2=2472/2062
cameraObjectResolution3=2472/2062
cameraObjectResolution4=2472/2062
cameraObjectResolution5=2472/2062
cameraObjectResolution6=2472/2062

# Camera principal point offset in pixels (cx/cy), can be decimals, estimated: middle of the image
cameraObjectPrincipalPointOffset1=1235.5/1030.5
cameraObjectPrincipalPointOffset2=1235.5/1030.5
cameraObjectPrincipalPointOffset3=1235.5/1030.5
cameraObjectPrincipalPointOffset4=1235.5/1030.5
cameraObjectPrincipalPointOffset5=1235.5/1030.5
cameraObjectPrincipalPointOffset6=1235.5/1030.5

# Distortion model: pinhole (OpenCV camera model, radial k1-k6 and tangential p1/p2)
# or fisheye (OpenCV fisheye model, k1-k4), the lens is not a fisheye lens
cameraObjectDistortionModel1=pinhole
cameraObjectDistortionModel2=pinhole
cameraObjectDistortionModel3=pinhole
cameraObjectDistortionModel4=pinhole
cameraObjectDistortionModel5=pinhole
cameraObjectDistortionModel6=pinhole

# Camera radial distortion parameters (k1/k2/k3/k4/k5/k6, can be decimals),
# estimated: k1/k2 fitted to horizontal, vertical and diagonal FOV of the lens on 1/3 inch sensor
# (gives -26.0% distortion at full field, specification -25.68%),
# outside of the 1/3 inch area (corners of 1/1.8 inch sensor) the distortion is extrapolated
cameraObjectRadialDistortionParameters1=-0.3839/0.1274/0.0/0.0/0.0/0.0
cameraObjectRadialDistortionParameters2=-0.3839/0.1274/0.0/0.0/0.0/0.0
cameraObjectRadialDistortionParameters3=-0.3839/0.1274/0.0/0.0/0.0/0.0
cameraObjectRadialDistortionParameters4=-0.3839/0.1274/0.0/0.0/0.0/0.0
cameraObjectRadialDistortionParameters5=-0.3839/0.1274/0.0/0.0/0.0/0.0
cameraObjectRadialDistortionParameters6=-0.3839/0.1274/0.0/0.0/0.0/0.0

# Tangential Distortion Parameters (p1/p2), estimated: no tangential distortion
cameraObjectTangentialDistortionParameters1=0.0/0.0
cameraObjectTangentialDistortionParameters2=0.0/0.0
cameraObjectTangentialDistortionParameters3=0.0/0.0
cameraObjectTangentialDistortionParameters4=0.0/0.0
cameraObjectTangentialDistortionParameters5=0.0/0.0
cameraObjectTangentialDistortionParameters6=0.0/0.0

# Camera f-number (aperture), fixed iris
cameraObjectAperture1=4.0
cameraObjectAperture2=4.0
cameraObjectAperture3=4.0
cameraObjectAperture4=4.0
cameraObjectAperture5=4.0
cameraObjectAperture6=4.0

# Camera focus distance in mm, 1000 = 1.0f, estimated: hyperfocal distance with 2 pixels circle of confusion
# (4^2 / (4 * 0.00548) + 4 = 734 mm, sharp from 367 mm to infinity)
cameraObjectFocusDistance1=734
cameraObjectFocusDistance2=734
cameraObjectFocusDistance3=734
cameraObjectFocusDistance4=734
cameraObjectFocusDistance5=734
cameraObjectFocusDistance6=734
