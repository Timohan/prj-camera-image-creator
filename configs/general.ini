# Position is in mm (200 = 0.2 on the field in the opengl drawing, decimals are allowed)
# Direction of the camera, where to camera is watching
baseObjectPosition=0/2000/-2000
baseObjectDirection=-300/-300/300
# direction line width/height in mm (100 = 0.1)
directionLineWidth=100
directionLinePositionHeight=1

outputDirectory=/home/timo/camera_output
# how fast in milliseconds, move
moveSpeed=1000
moveSpeedMouseWheel=300

# camera objects file in configs folder,
# for example cameraobjects.ini
# or cameraobjects_elp.ini
# or cameraobjects_ids.ini
cameraObjectsFile=cameraobjects_ids.ini

# file that is selected from the objects file
objectsFile=objects1.dat

# if cameras are visible for drawing at the start
# You can still press 'c' to set cameras visible/invisible
camerasVisible=1

# resolution of the saved images compared to the resolution of the camera,
# for example 0.5 saves half width and half height images
imageOutputScale=0.05
